name: Validate analysis
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ipykernel install --user --name python3
      - run: python scripts/execute_notebook.py --smoke
      - run: python -m co2_analysis --epochs 30
      - uses: actions/upload-artifact@v4
        with:
          name: co2-evaluation
          path: |
            results/reproduced/
            notebooks/*.executed.ipynb
